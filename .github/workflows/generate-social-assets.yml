name: Generar assets sociales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/*.svg"
      - ".github/workflows/generate-social-assets.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor SVG
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generar PNG
        run: |
          rsvg-convert -w 192 -h 192 assets/pokeball.svg -o assets/pokeball.png
          rsvg-convert -w 1200 -h 630 assets/yuli-master-pokemon.svg -o assets/yuli-master-pokemon.png
      - name: Guardar PNG
        run: |
          git config user.name "pokeweek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/pokeball.png assets/yuli-master-pokemon.png
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Generar favicon y banner social"
            git push
          fi
