name: Actualizar y publicar PokéWeek
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'assets/**'
      - 'data/**'
      - 'scripts/update_events.py'
      - '.github/workflows/update-events.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pokeweek-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar archivos públicos
        run: |
          mkdir -p _site
          cp .nojekyll index.html compartir.html app.js share.js push-config.js styles.css sw.js manifest.webmanifest version.json _site/
          cp -r assets data _site/
      - name: Generar agenda y miniaturas
        run: |
          python -m pip install requests pillow
          python scripts/update_events.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
