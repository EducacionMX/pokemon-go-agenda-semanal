name: Actualizar eventos Pokémon GO
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: update-events
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - run: python scripts/update_events.py
      - run: |
          git config user.name "pokeweek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.normalized.json assets/event-images
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Actualizar eventos normalizados"; git push; fi
