<body>
<main class="shell share-shell">
  <div class="masthead">
    <a class="brand" href="./" aria-label="Inicio de PokéWeek">
      <img src="assets/pokeball.svg" alt="" width="32" height="32">
      <span>PokéWeek</span>
    </a>
  </div>
  <section class="glass share-panel">
    <h1>La agenda Pokémon GO de Yuli</h1>
    <img id="shareArtwork" src="assets/yuli-master-pokemon-preview.jpg" width="1200" height="630"
         alt="Yuli Master Pokemon y una Pokébola sobre un fondo pastel.">
    <div class="share-actions">
      <a class="hero-cta" id="agendaLink" href="./">Abrir agenda</a>
      <button class="soft-btn" id="shareArtworkButton" hidden>Compartir imagen</button>
      <a class="soft-btn" href="assets/yuli-master-pokemon-preview.jpg" download="Yuli-Master-Pokemon.jpg">Descargar imagen</a>
      <button class="soft-btn" id="copyAgendaButton" hidden>Copiar enlace de la agenda</button>
    </div>
    <p class="hint">Puedes adjuntar la imagen a tu mensaje de WhatsApp y pegar el enlace de la agenda como pie de foto.</p>
    <p id="shareStatus" class="hint" role="status" hidden></p>
  </section>
</main>
</body>
